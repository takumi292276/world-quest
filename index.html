<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<title>World Quest｜地球儀で旅して、世界の課題を自分ごとに</title>
<meta name="description" content="地球儀をまわして国をえらび、カードで知り、バトルで学び、現実の小さな行動につなげる学習ゲーム。インストール不要・無料・匿名。高校生が個人で開発しています。">
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="World Quest">
<meta property="og:title" content="World Quest">
<meta property="og:description" content="地球儀で旅して、世界の課題を自分ごとにする学習ゲーム。">
<meta property="og:type" content="website">
<meta property="og:image" content="icons/icon-512.png">
<style>/* スマホで画面幅が2倍に広がってしまうのを防ぐ（Claudeの外で直接開くときだけ起きる） */
canvas{max-width:100vw}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap">
<style>
:root {
  /* slate scale */
  --s950: #020617; --s900: #0F172A; --s800: #1E293B; --s700: #334155; --s600: #475569;
  --s500: #64748B; --s400: #94A3B8; --s300: #CBD5E1; --s200: #E2E8F0; --s100: #F1F5F9; --s50: #F8FAFC;
  /* brand */
  --indigo: #6366F1; --indigo-600: #4F46E5; --violet: #8B5CF6; --violet-600: #7C3AED;
  --indigo-50: #EEF2FF; --indigo-100: #E0E7FF; --indigo-700: #4338CA;
  --emerald: #10B981; --emerald-50: #ECFDF5; --emerald-100: #D1FAE5; --emerald-700: #047857;
  --rose: #F43F5E; --rose-50: #FFF1F2; --rose-100: #FFE4E6; --rose-700: #BE123C;
  --amber: #F59E0B; --amber-50: #FFFBEB; --amber-100: #FEF3C7; --amber-700: #B45309;
  --sky: #0EA5E9; --sky-100: #E0F2FE;
  /* legacy names kept so nothing else breaks */
  --sky-0: var(--s950); --sky-1: var(--s900); --sky-2: #172554;
  --ink: var(--s900); --ink-soft: var(--s600); --ink-mute: var(--s500);
  --paper: #FFFFFF; --paper-2: var(--s100); --paper-line: var(--s200);
  --gold: var(--amber); --gold-deep: var(--amber-700);
  --teal: var(--sky); --teal-deep: #0369A1;
  --coral: var(--rose); --ok: var(--emerald); --ng: var(--rose);
  --hud: rgba(15, 23, 42, 0.72); --hud-line: rgba(148, 163, 184, 0.22);
  --grad: linear-gradient(135deg, var(--indigo) 0%, var(--violet) 100%);
  --grad-warm: linear-gradient(135deg, #F59E0B 0%, #F97316 100%);
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.08);
  --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.10), 0 2px 4px -2px rgba(15, 23, 42, 0.10);
  --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.12), 0 4px 6px -4px rgba(15, 23, 42, 0.10);
  --shadow-xl: 0 20px 25px -5px rgba(15, 23, 42, 0.18), 0 8px 10px -6px rgba(15, 23, 42, 0.12);
  --ring: 0 0 0 3px rgba(99, 102, 241, 0.35);
  --font-display: "Inter", "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", sans-serif;
  --font-body: "Inter", "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", sans-serif;
  --font-pixel: "Inter", "Noto Sans JP", system-ui, sans-serif;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-2xl: 24px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; touch-action: none;
  background: radial-gradient(120% 90% at 50% 20%, #1E1B4B 0%, var(--s900) 40%, var(--s950) 100%);
  color: #fff; font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01";
}
button { font-family: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: none; box-shadow: var(--ring); }
.hidden { display: none !important; }
[hidden] { display: none !important; }

/* ===== stars / globe ===== */
#stars { position: absolute; inset: 0; pointer-events: none; opacity: .7; }
#canvas-container { position: absolute; inset: 0; }
#canvas-container canvas { display: block; }

/* ===== HUD (top app bar) ===== */
.hud { position: absolute; left: 0; right: 0; top: 0; padding: 12px 14px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; pointer-events: none; z-index: 5; }
.hud > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 9px; background: var(--hud); border: 1px solid var(--hud-line); border-radius: var(--r-md); padding: 6px 12px 6px 6px; backdrop-filter: blur(10px); box-shadow: var(--shadow-md); }
.brand .compass { width: 28px; height: 28px; border-radius: 8px; background: var(--grad); padding: 5px; box-shadow: 0 2px 8px rgba(99,102,241,.45); }
.brand .compass circle:first-child { stroke: rgba(255,255,255,.9); }
.brand .name { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.01em; font-size: 15px; color: #fff; }
.hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.stat-row { display: flex; gap: 6px; }
.stat { display: flex; align-items: center; gap: 5px; background: var(--hud); border: 1px solid var(--hud-line); border-radius: 999px; padding: 5px 11px; font-family: var(--font-pixel); font-size: 12.5px; font-weight: 600; backdrop-filter: blur(10px); font-variant-numeric: tabular-nums; color: var(--s200); }
.stat b { color: #fff; font-weight: 700; }
.lang-toggle { display: inline-flex; border: 1px solid var(--hud-line); border-radius: 999px; overflow: hidden; background: var(--hud); backdrop-filter: blur(10px); padding: 3px; gap: 2px; }
.lang-toggle button { border: none; background: transparent; color: var(--s300); padding: 4px 10px; font-family: var(--font-display); font-weight: 600; font-size: 12px; border-radius: 999px; transition: background .15s, color .15s; }
.lang-toggle button.on { background: #fff; color: var(--s900); }
.hint { position: absolute; top: 72px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 500; color: var(--s200); background: var(--hud); border: 1px solid var(--hud-line); padding: 6px 14px; border-radius: 999px; pointer-events: none; z-index: 4; white-space: nowrap; backdrop-filter: blur(10px); }
.hint.away { opacity: 0; transition: opacity .4s; }

/* ===== bottom dock ===== */
.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 12px calc(12px + env(safe-area-inset-bottom)); display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; z-index: 5; pointer-events: none; }
.dock > * { pointer-events: auto; }
.legend { background: var(--hud); border: 1px solid var(--hud-line); border-radius: var(--r-md); padding: 9px 12px; backdrop-filter: blur(10px); font-size: 11.5px; color: var(--s200); box-shadow: var(--shadow-md); }
.legend .lt { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--s400); margin-bottom: 5px; font-family: var(--font-display); font-weight: 600; }
.legend .lr { display: flex; align-items: center; gap: 7px; line-height: 1.7; }
.legend .dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 25%, transparent); }
.dock-btns { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.dock-btn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--hud-line); background: var(--hud); color: #fff; border-radius: var(--r-md); padding: 10px 14px; font-family: var(--font-display); font-weight: 600; font-size: 13px; backdrop-filter: blur(10px); position: relative; box-shadow: var(--shadow-md); transition: transform .12s ease, background .15s; }
.dock-btn:active { transform: scale(.97); }
.dock-btn.gold { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 8px 20px rgba(99,102,241,0.40); }
.dock-btn .pip { position: absolute; top: -4px; right: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--rose); border: 2px solid var(--s900); }

/* ===== sheet (country panel) ===== */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 66%; background: #fff; color: var(--s900); border-radius: var(--r-2xl) var(--r-2xl) 0 0; border-top: 1px solid var(--s200); box-shadow: 0 -20px 50px rgba(2,6,23,0.45); transform: translateY(105%); transition: transform .38s cubic-bezier(.2,.8,.2,1); z-index: 8; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.sheet.open { transform: translateY(0); }
.sheet-grab { width: 40px; height: 4px; border-radius: 2px; background: var(--s300); margin: 10px auto 0; flex: none; }
.sheet-head { padding: 10px 18px 0; flex: none; display: flex; align-items: flex-start; gap: 12px; }
.sheet-head .flag { font-size: 30px; line-height: 1; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: var(--s100); border: 1px solid var(--s200); border-radius: var(--r-md); flex: none; }
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; text-wrap: balance; color: var(--s900); }
.sheet-head .sub { font-size: 12.5px; color: var(--s500); margin-top: 3px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; color: #fff; font-family: var(--font-display); }
.close-x { margin-left: auto; width: 34px; height: 34px; border-radius: var(--r-sm); border: 1px solid var(--s200); background: #fff; color: var(--s500); font-size: 15px; flex: none; transition: background .15s; }
.close-x:hover { background: var(--s100); }
.tabs { display: flex; gap: 3px; padding: 4px; margin: 12px 18px 0; flex: none; background: var(--s100); border-radius: var(--r-md); border: 1px solid var(--s200); }
.tab { flex: 1; border: none; background: transparent; padding: 8px 4px; font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--s500); border-radius: var(--r-sm); position: relative; transition: background .15s, color .15s, box-shadow .15s; }
.tab.on { color: var(--s900); background: #fff; box-shadow: var(--shadow-sm); }
.tab .badge { position: absolute; top: 3px; right: 6px; font-size: 9.5px; font-weight: 700; background: var(--indigo); color: #fff; border-radius: 999px; padding: 1px 5px; min-width: 16px; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 14px 18px calc(22px + env(safe-area-inset-bottom)); flex: 1; }
/* note: an opaque background on this scroll container made the WebGL globe drop out of composited screenshots; keep it transparent */

/* village */
.village { background: #fff; border-radius: var(--r-lg); padding: 10px; border: 1px solid var(--s200); box-shadow: var(--shadow-sm); }
.village svg { width: 100%; height: auto; display: block; border-radius: var(--r-md); }
.village .vl { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; padding: 0 4px; font-size: 12.5px; color: var(--s500); }
.village .vl b { font-family: var(--font-display); font-weight: 700; color: var(--s900); font-size: 14px; }
.bar { height: 8px; border-radius: 999px; background: var(--s100); overflow: hidden; margin: 8px 4px 0; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--grad); transition: width .5s ease; }
.mini-stats { display: flex; gap: 6px; margin: 10px 4px 2px; flex-wrap: wrap; }
.mini { font-size: 11px; font-weight: 600; background: var(--s100); border: 1px solid var(--s200); border-radius: 999px; padding: 3px 9px; color: var(--s600); }

/* cards */
.section-title { font-family: var(--font-display); font-weight: 700; font-size: 14px; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; color: var(--s900); letter-spacing: -0.01em; }
.section-title small { font-weight: 500; color: var(--s500); font-size: 11.5px; }
.kcard { background: #fff; border: 1px solid var(--s200); border-radius: var(--r-lg); padding: 16px; position: relative; overflow: hidden; box-shadow: var(--shadow-sm); }
.kcard .kc-top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--s500); font-family: var(--font-display); font-weight: 600; }
.kcard .kc-top .ico { font-size: 16px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-sm); background: color-mix(in srgb, var(--issue, var(--indigo)) 14%, #fff); }
.kcard .kc-num { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.1; color: var(--s900); margin: 8px 0 4px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kcard .kc-title { font-family: var(--font-display); font-weight: 700; font-size: 15px; margin-bottom: 6px; color: var(--s900); }
.kcard .kc-body { font-size: 14px; color: var(--s600); line-height: 1.6; }
.kcard.voice { background: var(--indigo-50); border-color: var(--indigo-100); }
.kcard.voice .kc-body { color: var(--indigo-700); font-size: 14px; }
.kcard.voice .kc-note { font-size: 10.5px; color: var(--s500); margin-top: 8px; }
.card-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 8px; }
.dots { display: flex; gap: 5px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--s300); transition: width .2s, background .2s; }
.dots i.on { background: var(--indigo); width: 18px; border-radius: 3px; }
.dots i.read { background: var(--emerald); }
.btn { border: none; border-radius: var(--r-md); padding: 11px 18px; font-family: var(--font-display); font-weight: 600; font-size: 14px; color: #fff; background: var(--grad); box-shadow: 0 4px 14px rgba(99,102,241,0.35); transition: transform .12s ease, box-shadow .15s, filter .15s; }
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: scale(0.97); }
.btn.gold { background: var(--grad-warm); color: #fff; box-shadow: 0 4px 14px rgba(245,158,11,0.35); }
.btn.ghost { background: #fff; color: var(--s700); box-shadow: none; border: 1px solid var(--s200); }
.btn.ghost:hover { background: var(--s50); }
.btn.small { padding: 8px 14px; font-size: 13px; }
.btn.block { width: 100%; display: block; }
.btn:disabled { opacity: 0.45; box-shadow: none; cursor: not-allowed; }
.btn.sm-ico { padding: 8px 12px; }

/* dungeon tab */
.diff-row { display: flex; gap: 8px; margin: 8px 0 12px; }
.diff { flex: 1; border: 1px solid var(--s200); background: #fff; border-radius: var(--r-md); padding: 11px 6px; text-align: center; box-shadow: var(--shadow-sm); transition: border-color .15s, background .15s; }
.diff b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--s900); }
.diff small { display: block; font-size: 10.5px; color: var(--s500); margin-top: 2px; }
.diff.easy.on { border-color: var(--emerald); background: var(--emerald-50); box-shadow: 0 0 0 3px rgba(16,185,129,.18); }
.diff.normal.on { border-color: var(--indigo); background: var(--indigo-50); box-shadow: 0 0 0 3px rgba(99,102,241,.18); }
.diff.hard.on { border-color: var(--rose); background: var(--rose-50); box-shadow: 0 0 0 3px rgba(244,63,94,.18); }
.locked { background: #fff; border: 1px dashed var(--s300); border-radius: var(--r-lg); padding: 16px; text-align: center; color: var(--s500); font-size: 13px; }
.wins { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

/* actions */
.act { display: flex; align-items: flex-start; gap: 10px; background: #fff; border: 1px solid var(--s200); border-radius: var(--r-md); padding: 12px; margin-bottom: 8px; box-shadow: var(--shadow-sm); }
.act .lv { flex: none; font-family: var(--font-pixel); font-weight: 700; font-size: 10.5px; color: var(--indigo-700); background: var(--indigo-50); border-radius: 6px; padding: 2px 7px; margin-top: 2px; letter-spacing: .02em; }
.act .tx { flex: 1; font-size: 13.5px; color: var(--s700); }
.act .ck { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--s300); background: #fff; color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.act.done { background: var(--emerald-50); border-color: var(--emerald-100); }
.act.done .ck { background: var(--emerald); border-color: var(--emerald); }
.act.lock { opacity: 0.55; }
.act.lock .ck { border-style: dashed; border-color: var(--s300); }
.photo-row { display: flex; gap: 8px; margin: 8px 0 12px; align-items: center; }
.photo-note { font-size: 11.5px; color: var(--s500); line-height: 1.5; }
.ai-out { background: var(--indigo-50); border: 1px solid var(--indigo-100); border-radius: var(--r-md); padding: 12px 14px; font-size: 13.5px; color: var(--indigo-700); margin: 8px 0; white-space: pre-wrap; line-height: 1.6; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links a { font-size: 12px; text-decoration: none; color: var(--s700); background: #fff; border: 1px solid var(--s200); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-family: var(--font-display); transition: border-color .15s; }
.links a:hover { border-color: var(--indigo); color: var(--indigo-700); }

/* chat */
.chat-log { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; margin-bottom: 8px; }
.msg { max-width: 88%; padding: 9px 13px; border-radius: var(--r-md); font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; }
.msg.u { align-self: flex-end; background: var(--grad); color: #fff; border-bottom-right-radius: 4px; }
.msg.a { align-self: flex-start; background: #fff; border: 1px solid var(--s200); color: var(--s800); border-bottom-left-radius: 4px; box-shadow: var(--shadow-sm); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chips button { border: 1px solid var(--s200); background: #fff; color: var(--s700); border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 500; text-align: left; transition: border-color .15s, color .15s; }
.chips button:hover { border-color: var(--indigo); color: var(--indigo-700); }
.chat-row { display: flex; gap: 6px; }
.chat-row input { flex: 1; border: 1px solid var(--s200); border-radius: var(--r-md); padding: 10px 14px; font-size: 16px; font-family: inherit; background: #fff; color: var(--s900); min-width: 0; transition: border-color .15s, box-shadow .15s; }
.chat-row input:focus { border-color: var(--indigo); }
.chat-note { font-size: 10.5px; color: var(--s500); margin-top: 6px; line-height: 1.5; }

/* ===== modal ===== */
.modal { position: fixed; inset: 0; background: rgba(2,6,23,0.6); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .25s; }
.modal.show { opacity: 1; pointer-events: auto; }
.modal .card { width: 100%; max-width: 520px; max-height: 84%; background: #fff; color: var(--s900); border-radius: var(--r-2xl) var(--r-2xl) 0 0; border: 1px solid var(--s200); padding: 20px 18px calc(22px + env(safe-area-inset-bottom)); overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; transform: translateY(30px); transition: transform .3s cubic-bezier(.2,.8,.2,1); box-shadow: var(--shadow-xl); }
.modal.show .card { transform: translateY(0); }
.modal.center { align-items: center; padding: 16px; }
.modal.center .card { border-radius: var(--r-xl); max-height: 88%; }
.modal h3 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; }
.modal .lead { font-size: 13.5px; color: var(--s500); margin: 0 0 14px; }

/* daily */
.tfq { background: #fff; border: 1px solid var(--s200); border-radius: var(--r-lg); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow-sm); }
.tfq .st { font-weight: 600; font-size: 14px; margin-bottom: 10px; color: var(--s900); }
.tf-btns { display: flex; gap: 8px; }
.tf-btns button { flex: 1; border: 1px solid var(--s200); background: #fff; border-radius: var(--r-md); padding: 12px; font-size: 20px; font-family: var(--font-display); font-weight: 700; color: var(--s900); transition: border-color .15s, background .15s; }
.tf-btns button.ok { border-color: var(--emerald); background: var(--emerald-50); }
.tf-btns button.ng { border-color: var(--rose); background: var(--rose-50); }
.why { font-size: 12.5px; color: var(--s600); margin-top: 8px; background: var(--s50); border: 1px solid var(--s200); border-radius: var(--r-sm); padding: 8px 10px; }
.streak { display: flex; align-items: center; gap: 12px; background: var(--grad); color: #fff; border-radius: var(--r-lg); padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 8px 20px rgba(99,102,241,.3); }
.streak .fl { font-size: 28px; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.18); border-radius: var(--r-md); }

.arena { position: relative; z-index: 3; flex: 1; min-height: 150px; display: flex; align-items: center; justify-content: center; }

@keyframes floaty { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }

@keyframes dying { 0% { opacity: 1; transform: scale(1) } 60% { opacity: .7; transform: scale(1.08) rotate(3deg); filter: brightness(2.2) } 100% { opacity: 0; transform: scale(.4) rotate(-10deg) } }
.foe-tag { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: #fff; font-family: var(--font-pixel); font-size: 12px; font-weight: 600; background: var(--hud); border: 1px solid var(--hud-line); padding: 5px 14px; border-radius: 999px; white-space: nowrap; backdrop-filter: blur(10px); }

@keyframes bossp { from { opacity: .75; transform: translateX(-50%) scale(1) } to { opacity: 1; transform: translateX(-50%) scale(1.06) } }
.combo { position: absolute; right: 14px; top: 8px; font-family: var(--font-pixel); color: #A5B4FC; font-size: 14px; font-weight: 700; text-shadow: 0 0 12px rgba(99,102,241,.8); }

@keyframes dmgf { 0% { opacity: 0; transform: translate(-50%, 10px) } 20% { opacity: 1 } 100% { opacity: 0; transform: translate(-50%, -50px) } }
.dg-panel { position: relative; z-index: 3; background: #fff; color: var(--s900); border-radius: var(--r-2xl) var(--r-2xl) 0 0; border-top: 1px solid var(--s200); padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -20px 50px rgba(2,6,23,.6); max-height: 60vh; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.timer { height: 6px; border-radius: 999px; background: var(--s100); overflow: hidden; margin-bottom: 12px; }

/* chain (boss) */

.shop { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 12px; }

@keyframes rise { 0% { opacity: 0; transform: translateY(40px) scale(.6) } 40% { opacity: 1; transform: translateY(0) scale(1.1) } 100% { opacity: 1; transform: translateY(-10px) scale(1) } }

@keyframes spark { 0% { opacity: 1; transform: translate(0,0) scale(1) } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.2) } }

/* tutorial */
.tut-steps { display: flex; flex-direction: column; gap: 10px; margin: 12px 0 16px; }

}

@keyframes mote { 0% { opacity: 0; transform: translate(var(--dx), 40px) scale(.7) } 20% { opacity: .8 } 80% { opacity: .5 } 100% { opacity: 0; transform: translate(calc(var(--dx) * 1.2), -70px) scale(1) } }

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const dayNumber = (d = new Date()) => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- sound (tiny synth) ---------- */
let AC = null;
function beep(type) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(); o.connect(g); g.connect(AC.destination);
    const now = AC.currentTime;
    const cfg = { ok: [880, 1320, 0.12], ng: [220, 140, 0.25], hit: [200, 90, 0.18], win: [660, 1320, 0.5], tap: [520, 520, 0.05] }[type] || [440, 440, 0.1];
    o.type = type === "hit" ? "sawtooth" : "triangle"; o.frequency.setValueAtTime(cfg[0], now); o.frequency.exponentialRampToValueAtTime(cfg[1], now + cfg[2]);
    g.gain.setValueAtTime(0.12, now); g.gain.exponentialRampToValueAtTime(0.001, now + cfg[2]);
    o.start(now); o.stop(now + cfg[2] + 0.02);
  } catch (e) {}
}

/* ---------- stars ---------- */
function drawStars() {

  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  ctx.scale(dpr, dpr); ctx.clearRect(0, 0, innerWidth, innerHeight);
  const n = Math.round((innerWidth * innerHeight) / 6000);
  let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  for (let i = 0; i < n; i++) { const x = rnd() * innerWidth, y = rnd() * innerHeight, r = rnd() * 1.3 + 0.2; ctx.globalAlpha = 0.25 + rnd() * 0.6; ctx.fillStyle = rnd() > 0.85 ? "#FFE8B0" : "#DCE6FF"; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
}

let DB = null, dbReady = null;
// capabilities are initialised LAZILY (first time a feature needs them) so signed-out viewers on the public link
// never get a "sign in" prompt just for opening the game. permissions.state() never prompts.
let PERM;
async function capState(name) {
  try {
    if (!(window.claude && claude.use)) return "unavailable";
    if (PERM === undefined) PERM = (await claude.use("permissions")) || null;
    return PERM ? await PERM.state(name) : "prompt";
  } catch (e) { return "unavailable"; }
}
function initDB() {
  if (dbReady) return dbReady;
  dbReady = (async () => { const st = await capState("db"); if (st === "unavailable" || st === "denied") return null; const db = await claude.use("db"); DB = db; return db; })().catch(() => null);
  return dbReady;
}
async function readCommunity() {
  const out = {}; const k = dayKey();
  for (const m of COMMUNITY_MISSIONS) out[m.id] = { total: 0, mine: !!S.localCheckins[m.id + "_" + k], shared: false };
  if (DB) {
    try {
      const snap = await DB.collection("checkins").where("mission", "in", COMMUNITY_MISSIONS.map((m) => m.id)).limit(1000).get();
      COMMUNITY_MISSIONS.forEach((m) => (out[m.id].total = 0));
      snap.docs.forEach((d) => { const v = d.data(); if (v && out[v.mission]) { out[v.mission].total += 1; if (d.id === S.anon + "_" + v.mission) out[v.mission].mine = v.day === k; } });
      COMMUNITY_MISSIONS.forEach((m) => (out[m.id].shared = true));
    } catch (e) { /* fall back to local */ }
  }
  if (!DB) COMMUNITY_MISSIONS.forEach((m) => { out[m.id].total = Object.keys(S.localCheckins).filter((x) => x.startsWith(m.id + "_")).length; });
  return out;
}
async function toggleCheckin(mid) {
  const k = dayKey(); const key = mid + "_" + k; const wasOn = !!S.localCheckins[key];
  if (wasOn) delete S.localCheckins[key]; else S.localCheckins[key] = true; save();
  if (DB) { try { const ref = DB.collection("checkins").doc(S.anon + "_" + mid); if (wasOn) await ref.delete(); else await ref.set({ mission: mid, day: k, ts: Date.now() }); } catch (e) {} }
  return !wasOn;
}
async function syncPlayer() { if (!DB) return; try { await DB.doc("players/" + S.anon).set({ pts: totalPts(), updatedAt: Date.now() }); } catch (e) {} }
async function readPlayers() { if (!DB) return null; try { const snap = await DB.collection("players").limit(1000).get(); let sum = 0; snap.docs.forEach((d) => { sum += Number(d.data()?.pts || 0); }); return { sum, n: snap.size }; } catch (e) { return null; } }
async function renderCommunity() {

  card.innerHTML = `<h3>${ic("community")} ${esc(t("commTitle"))}</h3><p class="lead">${esc(t("commLead"))}</p><div class="note">…</div>`;
  await initDB(); await syncPlayer(); const data = await readCommunity(); const players = await readPlayers();
  card.innerHTML = `<h3>${ic("community")} ${esc(t("commTitle"))}</h3><p class="lead">${esc(t("commLead"))}</p>
    ${COMMUNITY_MISSIONS.map((m) => { const s = data[m.id]; const inCycle = s.total % m.unit; const pct = inCycle / m.unit * 100; return `<div class="cm"><div class="ct">${gi(m.icon)} ${esc(L(m))}</div><div class="cbar"><i style="width:${pct}%"></i></div><div class="cnt">${esc(t("commCount", inCycle, m.unit, s.total))}</div><button class="btn small ${s.mine ? "joined" : ""}" data-cm="${m.id}" type="button">${s.mine ? esc(t("commIn")) : ic("correct") + " " + esc(t("commDo"))}</button></div>`; }).join("")}

/* ---------- AI: chat + photo (sample capability) ---------- */
let SAMPLE = null, sampleReady = null, chatTurns = [], chatCountry = null;
function initSample() {
  if (sampleReady) return sampleReady;
  sampleReady = (async () => { const st = await capState("sample"); if (st === "unavailable" || st === "denied") return null; const s = await claude.use("sample"); SAMPLE = s; return s; })().catch(() => null);

function factsFor(c) { return [`${L(c.name)} (${L(c.region)})`, `${t("product")}: ${L(c.product)}`, L(c.japan), ...c.cards.map((k) => `${L(k.title)}: ${L(k.num)} — ${L(k.body)}`), `${L(c.chain.title)}: ${c.chain.steps.map(L).join(" → ")}`].join("\n");
}
function chatInstruction(c) {
  return LANG === "ja"
    ? `あなたは学習アプリ「World Quest」の案内役です。相手は日本の中高生。国「${L(c.name)}」について、下の事実をもとに、やさしい日本語で2〜4文で答えてください。数字は下の事実にあるものだけを使い、確かでないことは「確かではない」と言ってください。国や人々を悪く言わず、課題を「その国の人のせい」にしないでください。最後に、相手が今日できる小さな一歩を1つ添えてください。\n\n【事実】\n${factsFor(c)}`
    : `You are the guide in a learning app called World Quest. The user is a Japanese high-school student. Answer questions about ${L(c.name)} in 2–4 simple sentences, using ONLY the facts below for numbers; say "I'm not sure" when unsure. Never blame the country or its people. End with one small step the user can take today.\n\nFACTS:\n${factsFor(c)}`;
}
function wireChat(c) {
  if (chatCountry !== c.id) { chatTurns = []; chatCountry = c.id; }
  const log = $("#chat-log"), input = $("#chat-in"), send = $("#chat-send");
  const add = (role, text) => { const d = document.createElement("div"); d.className = "msg " + (role === "user" ? "u" : "a"); d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; };
  chatTurns.forEach((m) => add(m.role, m.content));
  const ask = async (q) => {
    q = (q || "").trim(); if (!q) return;
    input.value = ""; send.disabled = true; add("user", q); chatTurns.push({ role: "user", content: q });
    const out = add("assistant", t("thinking"));
    await initSample();
    if (!SAMPLE) { out.textContent = t("askUnavailable"); send.disabled = false; return; }
    try {
      const turns = [{ role: "user", content: chatInstruction(c) }, ...chatTurns.slice(-8)];
      const r = await SAMPLE(turns, { modelTier: "quick", cache: false, onText: ({ text }) => { out.textContent = text; log.scrollTop = log.scrollHeight; } });
      out.textContent = r.text; chatTurns.push({ role: "assistant", content: r.text });
    } catch (e) {
      if (e && e.text) { out.textContent = e.text; } else if (e && (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "not_declared")) { out.textContent = t("askUnavailable"); } else if (e && e.code === "rate_limited") { out.textContent = LANG === "ja" ? "少し時間をおいてから、もう一度聞いてみてください。" : "Please wait a moment and try again."; } else { out.textContent = LANG === "ja" ? "うまく答えられませんでした。別の聞き方を試してみてください。" : "Couldn't answer that — try asking another way."; }
      chatTurns.pop();
    } finally { send.disabled = false; }
  };
  send.addEventListener("click", () => ask(input.value));
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(input.value); });
  $$("#chips button").forEach((b) => b.addEventListener("click", () => ask(t("chips")[Number(b.dataset.q)])));
  initSample().then((s) => { if (!s) { $("#chat-note").textContent = t("askUnavailable"); send.disabled = true; $$("#chips button").forEach((b) => (b.disabled = true)); } });
}
async function photoReflect(c, file) {
  const status = $("#photo-status"), out = $("#photo-out"); status.textContent = t("thinking"); out.innerHTML = "";
  await initSample();
  if (!SAMPLE) { status.textContent = t("askUnavailable"); return; }
  let caps = null; try { caps = await SAMPLE.limits(); } catch (e) {}
  if (!caps || !caps.images) { status.textContent = LANG === "ja" ? "この環境では写真を送れません（文章での質問は使えます）。" : "Photos can't be sent in this view (text questions still work)."; return; }
  const st = S.countries[c.id]; const doneActs = Object.keys(st.actions).map((i) => L(REAL_ACTIONS[c.issue][Number(i)]));
  const prompt = LANG === "ja"
    ? `これは日本の中高生が、学習アプリで「${L(c.name)}」について学んだあと、現実の小さな行動（例：${doneActs.join("／") || L(REAL_ACTIONS[c.issue][0])}）をした記録として撮った写真です。写真に写っているものを1文で受け止め、合否の判定はせず、あたたかく励まし、次にできる小さな一歩を1つ提案してください。合計3文以内、やさしい日本語。写真の中の人物を特定したり、名前や場所を推測したりしないでください。`
    : `This photo was taken by a Japanese high-school student as a record of a small real-world action (e.g. ${doneActs.join(" / ") || L(REAL_ACTIONS[c.issue][0])}) after learning about ${L(c.name)} in a learning app. In at most 3 warm sentences: acknowledge what's in the photo, do not judge pass/fail, encourage them, and suggest one small next step. Do not identify people or guess names or places.`;
  try {
    const r = await SAMPLE(prompt, { images: file, modelTier: "quick", cache: false, onText: ({ text }) => { out.innerHTML = `<div class="ai-out">${esc(text)}</div>`; } });
    out.innerHTML = `<div class="ai-out">${esc(r.text)}</div>`; status.textContent = "✓";
  } catch (e) { status.textContent = e && e.code === "image_rejected" ? (LANG === "ja" ? "この写真は送れませんでした。別の写真を試してください。" : "That photo couldn't be sent — try another.") : (LANG === "ja" ? "うまく返せませんでした。" : "Couldn't reply this time."); }
  finally { $("#photo-in").value = ""; }
}

/* ---------- init ---------- */
function init() {
  S = loadState(); LANG = S.lang || "ja";
  drawStars(); initGlobe(); renderHUD(); ensureDaily();
  $("#lang-ja").addEventListener("click", () => setLang("ja")); $("#lang-en").addEventListener("click", () => setLang("en"));
  $("#btn-daily").addEventListener("click", () => { renderDaily(); openModal("#m-daily"); beep("tap"); });
  $("#btn-community").addEventListener("click", () => { renderCommunity(); openModal("#m-community"); beep("tap"); });
  $("#btn-journal").addEventListener("click", () => { renderJournal(); openModal("#m-journal"); beep("tap"); });
  if (typeof FEEDBACK_URL === "string" && FEEDBACK_URL) { const fb = $("#btn-feedback"); fb.href = FEEDBACK_URL; fb.hidden = false; document.body.classList.add("has-fb"); }
  if (!S.tut) { renderTutorial(); openModal("#m-tut"); }
  setTimeout(() => $("#hint").classList.add("away"), 9000);
}
init();
